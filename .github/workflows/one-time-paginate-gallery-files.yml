name: One-time gallery file pagination

on:
  push:
    paths:
      - '.github/workflows/one-time-paginate-gallery-files.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Paginate gallery storage listings
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/app/dashboard/galerias/page.tsx')
          text = path.read_text()

          state_marker = ' const[capaModal,setCapaModal]=useState<string|null>(null),[fotosCapa,setFotosCapa]=useState<FotoModal[]>([]),[carregandoCapa,setCarregandoCapa]=useState(false),[selecaoModal,setSelecaoModal]=useState<string|null>(null);\n'
          helper = ''' async function listarArquivosGaleria(gid:string){const nomes:string[]=[];let offset=0;while(true){const{data,error}=await supabase.storage.from("fotos").list(`${uid||"__UID__"}/${gid}`,{limit:1000,offset,sortBy:{column:"created_at",order:"asc"}});if(error)throw error;const pagina=(data??[]).filter(f=>f.id!==null);nomes.push(...pagina.map(f=>f.name));if((data??[]).length<1000)break;offset+=1000}return nomes}\n'''
          if state_marker not in text:
              raise SystemExit('State marker not found; refusing to edit')
          # Helper gets uid explicitly during initial load to avoid stale state.
          helper = ''' async function listarArquivosGaleria(gid:string,userId=uid){const nomes:string[]=[];let offset=0;while(true){const{data,error}=await supabase.storage.from("fotos").list(`${userId}/${gid}`,{limit:1000,offset,sortBy:{column:"created_at",order:"asc"}});if(error)throw error;const pagina=(data??[]).filter(f=>f.id!==null);nomes.push(...pagina.map(f=>f.name));if((data??[]).length<1000)break;offset+=1000}return nomes}\n'''
          text = text.replace(state_marker, state_marker + helper, 1)

          old_list = 'const listagens=await Promise.all(bases.map(async row=>{const{data}=await supabase.storage.from("fotos").list(`${meuId}/${row.id}`,{limit:500,sortBy:{column:"created_at",order:"asc"}});return{id:row.id as string,arquivos:(data??[]).filter(f=>f.id!==null).map(f=>f.name)}}));'
          new_list = 'const listagens=await Promise.all(bases.map(async row=>{try{return{id:row.id as string,arquivos:await listarArquivosGaleria(row.id as string,meuId)}}catch{return{id:row.id as string,arquivos:[] as string[]}}}));'
          if old_list not in text:
              raise SystemExit('Initial list block not found; refusing to edit')
          text = text.replace(old_list, new_list, 1)

          old_cover = ' async function abrirCapa(g:Galeria){setCapaModal(g.id);setCarregandoCapa(true);setFotosCapa([]);const caminhos=g.arquivos.flatMap(nome=>[`${uid}/${g.id}/thumbs/${nome}`,`${uid}/${g.id}/${nome}`]);const{data}=caminhos.length?await supabase.storage.from("fotos").createSignedUrls(caminhos,3600):{data:[]};const m=new Map((data??[]).filter(u=>u.path&&u.signedUrl).map(u=>[u.path as string,u.signedUrl as string]));setFotosCapa(g.arquivos.map(nome=>({nome,thumb:m.get(`${uid}/${g.id}/thumbs/${nome}`)??"",original:m.get(`${uid}/${g.id}/${nome}`)??""})));setCarregandoCapa(false)}'
          new_cover = ' async function abrirCapa(g:Galeria){setCapaModal(g.id);setCarregandoCapa(true);setFotosCapa([]);try{const arquivos=await listarArquivosGaleria(g.id);if(arquivos.length!==g.arquivos.length)setGalerias(p=>p.map(x=>x.id===g.id?{...x,arquivos,qtd:arquivos.length}:x));const caminhos=arquivos.flatMap(nome=>[`${uid}/${g.id}/thumbs/${nome}`,`${uid}/${g.id}/${nome}`]);const{data}=caminhos.length?await supabase.storage.from("fotos").createSignedUrls(caminhos,3600):{data:[]};const m=new Map((data??[]).filter(u=>u.path&&u.signedUrl).map(u=>[u.path as string,u.signedUrl as string]));setFotosCapa(arquivos.map(nome=>({nome,thumb:m.get(`${uid}/${g.id}/thumbs/${nome}`)??"",original:m.get(`${uid}/${g.id}/${nome}`)??""})))}catch{setAviso("Não foi possível carregar todas as fotos da galeria.")}finally{setCarregandoCapa(false)}}'
          if old_cover not in text:
              raise SystemExit('Cover block not found; refusing to edit')
          text = text.replace(old_cover, new_cover, 1)

          path.write_text(text)
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app/dashboard/galerias/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: paginate gallery file listings"
          git push origin main
