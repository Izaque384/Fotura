name: One-time resilient upload

on:
  push:
    paths:
      - '.github/workflows/one-time-resilient-upload.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Harden upload failure handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/app/upload/page.tsx')
          text = path.read_text()

          old_start = ''' async function enviarFotos(){setErro(false);setLink("");setMensagem("");if(!arquivos?.length){setErro(true);setMensagem("Escolha pelo menos uma foto.");return}const{data:u}=await supabase.auth.getUser();if(!u.user){router.replace("/login");return}const uid=u.user.id;let galeriaId=galeriaFixa;\n'''
          new_start = ''' async function enviarFotos(){setErro(false);setLink("");setMensagem("");if(!arquivos?.length){setErro(true);setMensagem("Escolha pelo menos uma foto.");return}const{data:u}=await supabase.auth.getUser();if(!u.user){router.replace("/login");return}const uid=u.user.id;let galeriaId=galeriaFixa,galeriaCriadaAgora=false,clienteCriadoAgora:string|null=null;\n'''
          if old_start not in text:
              raise SystemExit('Upload start block not found')
          text = text.replace(old_start, new_start, 1)

          old_create = '''  if(!galeriaId){const t=nomeGaleria.trim();if(!t){setErro(true);setMensagem("Dê um nome pra galeria.");return}const novoNome=novoCliente?clienteNome.trim():"";if(novoCliente&&!novoNome){setErro(true);setMensagem("Informe o nome do novo cliente.");return}const{data:nova,error:e}=await supabase.rpc("criar_galeria_transacional",{p_slug:gerarSlug(t),p_titulo:t,p_cliente_id:novoCliente?null:(clienteId||null),p_cliente_nome:novoCliente?novoNome:null,p_cliente_email:novoCliente?(clienteEmail.trim()||null):null,p_cliente_telefone:novoCliente?(clienteTelefone.trim()||null):null}).single();const registro=nova as {galeria_id:string}|null;if(e||!registro){setErro(true);setMensagem("Não foi possível criar a galeria.");return}galeriaId=registro.galeria_id}\n'''
          new_create = '''  if(!galeriaId){const t=nomeGaleria.trim();if(!t){setErro(true);setMensagem("Dê um nome pra galeria.");return}const novoNome=novoCliente?clienteNome.trim():"";if(novoCliente&&!novoNome){setErro(true);setMensagem("Informe o nome do novo cliente.");return}const{data:nova,error:e}=await supabase.rpc("criar_galeria_transacional",{p_slug:gerarSlug(t),p_titulo:t,p_cliente_id:novoCliente?null:(clienteId||null),p_cliente_nome:novoCliente?novoNome:null,p_cliente_email:novoCliente?(clienteEmail.trim()||null):null,p_cliente_telefone:novoCliente?(clienteTelefone.trim()||null):null}).single();const registro=nova as {galeria_id:string;cliente_id:string|null}|null;if(e||!registro){setErro(true);setMensagem("Não foi possível criar a galeria.");return}galeriaId=registro.galeria_id;galeriaCriadaAgora=true;clienteCriadoAgora=novoCliente?registro.cliente_id:null}\n'''
          if old_create not in text:
              raise SystemExit('Gallery creation block not found')
          text = text.replace(old_create, new_create, 1)

          old_loop = '''  setEnviando(true);let enviadas=0;const lista=Array.from(arquivos);for(let i=0;i<lista.length;i++){const arq=lista[i],nomeLimpo=arq.name.replace(/[^a-zA-Z0-9._-]/g,"_"),nome=`${Date.now()}-${i}-${nomeLimpo}`,caminho=`${uid}/${galeriaId}/${nome}`;const{error}=await supabase.storage.from("fotos").upload(caminho,arq);if(error){setErro(true);setMensagem(`Erro ao enviar ${arq.name}.`);setEnviando(false);return}const thumb=await gerarMiniatura(arq);if(thumb)await supabase.storage.from("fotos").upload(`${uid}/${galeriaId}/thumbs/${nome}`,thumb,{contentType:"image/jpeg"});enviadas++}setMensagem(`${enviadas} foto(s) enviada(s) com sucesso!`);setLink(`${window.location.origin}/g/${galeriaId}`);setEnviando(false)}\n'''
          new_loop = '''  setEnviando(true);let enviadas=0;const falhas:string[]=[],lista=Array.from(arquivos);for(let i=0;i<lista.length;i++){const arq=lista[i],nomeLimpo=arq.name.replace(/[^a-zA-Z0-9._-]/g,"_"),nome=`${Date.now()}-${i}-${nomeLimpo}`,caminho=`${uid}/${galeriaId}/${nome}`;const{error}=await supabase.storage.from("fotos").upload(caminho,arq);if(error){falhas.push(arq.name);continue}const thumb=await gerarMiniatura(arq);if(thumb)await supabase.storage.from("fotos").upload(`${uid}/${galeriaId}/thumbs/${nome}`,thumb,{contentType:"image/jpeg"});enviadas++}if(enviadas===0){if(galeriaCriadaAgora&&galeriaId){const{error:rollbackError}=await supabase.rpc("desfazer_galeria_vazia",{p_galeria:galeriaId,p_cliente_id:clienteCriadoAgora});if(!rollbackError){setErro(true);setMensagem("Nenhuma foto foi enviada. A galeria vazia foi descartada; tente novamente.");setEnviando(false);return}}setErro(true);setMensagem("Nenhuma foto foi enviada. Tente novamente antes de compartilhar a galeria.");setEnviando(false);return}setLink(`${window.location.origin}/g/${galeriaId}`);if(falhas.length){setErro(true);const amostra=falhas.slice(0,3).join(", "),restante=falhas.length>3?` e mais ${falhas.length-3}`:"";setMensagem(`${enviadas} foto(s) enviada(s). ${falhas.length} falharam: ${amostra}${restante}. Tente enviar novamente apenas as que falharam.`)}else{setMensagem(`${enviadas} foto(s) enviada(s) com sucesso!`)}setEnviando(false)}\n'''
          if old_loop not in text:
              raise SystemExit('Upload loop block not found')
          text = text.replace(old_loop, new_loop, 1)

          path.write_text(text)

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app/upload/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: make photo uploads resilient to partial failures"
          git push origin main
