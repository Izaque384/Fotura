name: One-time transactional gallery client wiring

on:
  push:
    paths:
      - '.github/workflows/one-time-transactional-gallery-client.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire transactional gallery/client RPCs
        shell: python
        run: |
          from pathlib import Path

          # Upload page
          up = Path('app/app/upload/page.tsx')
          text = up.read_text()
          old_helper = ''' async function garantirCliente(uid:string){if(!novoCliente)return clienteId||null;const nome=clienteNome.trim();if(!nome){setErro(true);setMensagem("Informe o nome do novo cliente.");return undefined}const{data,error}=await supabase.from("clientes").insert({user_id:uid,nome,email:clienteEmail.trim()||null,telefone:clienteTelefone.trim()||null}).select("id,nome,email,telefone").single();if(error||!data){setErro(true);setMensagem("Não foi possível cadastrar o cliente.");return undefined}setClientes(p=>[...p,data as Cliente].sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR")));setClienteId(data.id);return data.id as string}\n'''
          if old_helper not in text:
              raise SystemExit('Upload garantirCliente not found')
          text = text.replace(old_helper, '', 1)

          old_create = '''  if(!galeriaId){const t=nomeGaleria.trim();if(!t){setErro(true);setMensagem("Dê um nome pra galeria.");return}const vinculo=await garantirCliente(uid);if(vinculo===undefined)return;const{data:nova,error:e}=await supabase.from("galerias").insert({user_id:uid,slug:gerarSlug(t),titulo:t,cliente_id:vinculo}).select("id").single();if(e||!nova){setErro(true);setMensagem("Não foi possível criar a galeria.");return}galeriaId=nova.id as string}\n'''
          new_create = '''  if(!galeriaId){const t=nomeGaleria.trim();if(!t){setErro(true);setMensagem("Dê um nome pra galeria.");return}const novoNome=novoCliente?clienteNome.trim():"";if(novoCliente&&!novoNome){setErro(true);setMensagem("Informe o nome do novo cliente.");return}const{data:nova,error:e}=await supabase.rpc("criar_galeria_transacional",{p_slug:gerarSlug(t),p_titulo:t,p_cliente_id:novoCliente?null:(clienteId||null),p_cliente_nome:novoCliente?novoNome:null,p_cliente_email:novoCliente?(clienteEmail.trim()||null):null,p_cliente_telefone:novoCliente?(clienteTelefone.trim()||null):null}).single();if(e||!nova){setErro(true);setMensagem("Não foi possível criar a galeria.");return}galeriaId=nova.galeria_id as string}\n'''
          if old_create not in text:
              raise SystemExit('Upload creation block not found')
          text = text.replace(old_create, new_create, 1)
          up.write_text(text)

          # Galleries page
          gp = Path('app/app/dashboard/galerias/page.tsx')
          text = gp.read_text()
          old_helper = ''' async function garantirCliente(){if(!novoCliente)return fCliente||null;const nome=ncNome.trim();if(!nome){setAviso("Informe o nome do novo cliente.");return undefined}const{data,error}=await supabase.from("clientes").insert({user_id:uid,nome,email:ncEmail.trim()||null,telefone:ncTelefone.trim()||null}).select("id,nome,email,telefone").single();if(error||!data){setAviso("Não foi possível cadastrar o cliente.");return undefined}setClientes(p=>[...p,data as Cliente].sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR")));setFCliente(data.id);return data.id as string}\n'''
          if old_helper not in text:
              raise SystemExit('Galerias garantirCliente not found')
          text = text.replace(old_helper, '', 1)

          old_save = ''' async function salvarConfig(){if(!configModal||salvando)return;const g=galerias.find(x=>x.id===configModal);if(!g)return;setSalvando(true);const cliente=await garantirCliente();if(cliente===undefined){setSalvando(false);return}let temSenha=g.config.temSenha;const senha=fSenha.trim();if(senha){const{error}=await supabase.from("senhas").upsert({galeria:g.id,senha,atualizado_em:new Date().toISOString()});if(error){setAviso("Não foi possível salvar a senha.");setSalvando(false);return}temSenha=true}const novo:Config={prova:fProva,limite:Math.max(0,parseInt(fLimite||"0",10)||0),prazo:fPrazo||null,linkAte:fLink||null,temSenha};const{error}=await supabase.from("galerias").update({prova:novo.prova,limite:novo.limite,prazo:novo.prazo,link_ate:novo.linkAte,tem_senha:novo.temSenha,cliente_id:cliente}).eq("id",g.id).eq("user_id",uid);setSalvando(false);if(error){setAviso("Não foi possível salvar as configurações.");return}setGalerias(p=>p.map(x=>x.id===g.id?{...x,clienteId:cliente,config:novo}:x));setConfigModal(null);setAviso("Configurações salvas.")}\n'''
          new_save = ''' async function salvarConfig(){if(!configModal||salvando)return;const g=galerias.find(x=>x.id===configModal);if(!g)return;const novoNome=novoCliente?ncNome.trim():"";if(novoCliente&&!novoNome){setAviso("Informe o nome do novo cliente.");return}setSalvando(true);const limite=Math.max(0,parseInt(fLimite||"0",10)||0),senha=fSenha.trim();const{data:res,error}=await supabase.rpc("atualizar_galeria_transacional",{p_galeria:g.id,p_prova:fProva,p_limite:limite,p_prazo:fPrazo||null,p_link_ate:fLink||null,p_cliente_id:novoCliente?null:(fCliente||null),p_cliente_nome:novoCliente?novoNome:null,p_cliente_email:novoCliente?(ncEmail.trim()||null):null,p_cliente_telefone:novoCliente?(ncTelefone.trim()||null):null,p_senha:senha||null}).single();setSalvando(false);if(error||!res){setAviso("Não foi possível salvar as configurações.");return}const cliente=(res.cliente_id as string|null)??null,temSenha=Boolean(res.tem_senha),novo:Config={prova:fProva,limite,prazo:fPrazo||null,linkAte:fLink||null,temSenha};if(novoCliente&&cliente){const criado:Cliente={id:cliente,nome:novoNome,email:ncEmail.trim()||null,telefone:ncTelefone.trim()||null};setClientes(p=>p.some(c=>c.id===cliente)?p:[...p,criado].sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR")))}setFCliente(cliente??"");setGalerias(p=>p.map(x=>x.id===g.id?{...x,clienteId:cliente,config:novo}:x));setConfigModal(null);setAviso("Configurações salvas.")}\n'''
          if old_save not in text:
              raise SystemExit('Galerias salvarConfig not found')
          text = text.replace(old_save, new_save, 1)
          gp.write_text(text)

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app/upload/page.tsx app/app/dashboard/galerias/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: make gallery client writes transactional"
          git push origin main
