name: Audit dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-lockfile.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependency tree without scripts
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        working-directory: app
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("audit-prod.json","utf8")); console.log("PROD_AUDIT_COUNTS="+JSON.stringify(a.metadata?.vulnerabilities||{})); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(`PROD_VULN ${name} severity=${v.severity} direct=${v.isDirect} range=${v.range}`);'

      - name: Audit all dependencies
        working-directory: app
        shell: bash
        run: |
          npm audit --json > audit-all.json || true
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("audit-all.json","utf8")); console.log("ALL_AUDIT_COUNTS="+JSON.stringify(a.metadata?.vulnerabilities||{})); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(`ALL_VULN ${name} severity=${v.severity} direct=${v.isDirect} range=${v.range}`);'
