name: One-time upgrade upload block
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python3 .github/scripts/upgrade_upload_block.py
      - run: npm install tus-js-client@4.3.1 --save-exact
        working-directory: app
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/app/upload/page.tsx' app/package.json app/package-lock.json
          git commit -m "feat: make photo uploads resumable and recoverable"
          git push origin main
