name: E2E regression

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      # A dummy value avoids throwing during Supabase client construction in
      # isolated UI tests. It is NEVER a credential for a real project.
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder_not_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Production build and TypeScript check
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: R2 release gate - unauthenticated and cross-origin requests
        run: npx playwright test tests/e2e/r2-storage-security.spec.ts --workers=1
      - run: npm run test:e2e
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Development dependency audit
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
