name: One-time dependency security refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-security-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Upgrade patched Next.js and lint config
        run: npm install --save-exact next@16.3.8 eslint-config-next@16.3.8
      - name: Apply safe transitive fixes
        run: npm audit fix
      - name: Verify production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      - name: Verify high/critical audit
        run: npm audit --audit-level=high
      - name: Commit refreshed dependency lock
        working-directory: .
        run: |
          rm .github/workflows/dependency-security-refresh.yml
          git config user.name "Fotura Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/package.json app/package-lock.json .github/workflows/dependency-security-refresh.yml
          git commit -m "security: patch Next.js and audited dependencies"
          git push origin HEAD:main
