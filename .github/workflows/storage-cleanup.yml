name: Storage cleanup regression
on:
  push:
    branches: [main]
    paths: ["supabase/**", "tests/storage-cleanup.test.ts", "tests/r2-migration-safety.test.ts", "tests/r2-aux-media-safety.test.ts", "tests/r2-private-reads.test.ts", "tests/r2-limited-request-body.test.ts", ".github/workflows/storage-cleanup.yml"]
  pull_request:
    paths: ["supabase/**", "tests/storage-cleanup.test.ts", "tests/r2-migration-safety.test.ts", "tests/r2-aux-media-safety.test.ts", "tests/r2-private-reads.test.ts", "tests/r2-limited-request-body.test.ts", ".github/workflows/storage-cleanup.yml"]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/storage-cleanup.test.ts tests/r2-migration-safety.test.ts tests/r2-aux-media-safety.test.ts tests/r2-private-reads.test.ts tests/r2-limited-request-body.test.ts
  r2-sql-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL syntax parser (no remote database access)
        run: python -m pip install pglast==8.7
      - name: Parse all R2 migration scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = sorted(Path("supabase/migrations").glob("*_r2_*.sql"))
          if len(files) < 7:
              raise SystemExit("Expected all seven R2 migrations to be versioned")
          for path in files:
              try:
                  parsed = parse_sql(path.read_text(encoding="utf-8"))
                  if not parsed:
                      raise ValueError("Empty SQL migration")
              except Exception as error:
                  raise SystemExit(f"Invalid SQL syntax in {path}: {error}")
          print(f"Parsed {len(files)} R2 migrations (syntax only; does not execute DDL).")
          PY

  r2-local-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fotura_r2_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fotura_r2_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: fotura_r2_tests
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply disposable schema fixture (not connected to Supabase production)
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/r2_local_fixture.sql
      - name: Execute each staged R2 migration
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*_r2_*.sql; do
            echo "Applying $migration in disposable PostgreSQL"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Execute R2 registration and cleanup SQL assertions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/r2_local_contract.sql

  edge-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck staged Supabase R2 cleanup Edge Function
        # No function is deployed; no user data or Supabase credentials.
        run: deno check supabase/functions/storage-cleanup/index.ts
