name: Storage cleanup regression
on:
  push:
    branches: [main]
    paths: ["supabase/**", "tests/storage-cleanup.test.ts", "tests/r2-migration-safety.test.ts", "tests/r2-aux-media-safety.test.ts", ".github/workflows/storage-cleanup.yml"]
  pull_request:
    paths: ["supabase/**", "tests/storage-cleanup.test.ts", "tests/r2-migration-safety.test.ts", "tests/r2-aux-media-safety.test.ts", ".github/workflows/storage-cleanup.yml"]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/storage-cleanup.test.ts tests/r2-migration-safety.test.ts tests/r2-aux-media-safety.test.ts
  r2-sql-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL syntax parser (no remote database access)
        run: python -m pip install pglast==8.7
      - name: Parse all R2 migration scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = sorted(Path("supabase/migrations").glob("*_r2_*.sql"))
          if len(files) < 7:
              raise SystemExit("Expected all seven R2 migrations to be versioned")
          for path in files:
              try:
                  parsed = parse_sql(path.read_text(encoding="utf-8"))
                  if not parsed:
                      raise ValueError("Empty SQL migration")
              except Exception as error:
                  raise SystemExit(f"Invalid SQL syntax in {path}: {error}")
          print(f"Parsed {len(files)} R2 migrations (syntax only; does not execute DDL).")
          PY
